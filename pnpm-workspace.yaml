ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@types/node@25.9.0'
  - tsx@4.22.2
  - dsh-h3@0.2.2
  - bumpp@12.0.0

shellEmulator: true
trustPolicy: no-downgrade
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  dsh-antfubot: true
  esbuild: true
  koffi: true
  node-pty: true
  playwright: true
  protobufjs: true
  simple-git-hooks: true
